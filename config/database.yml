# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production uses PostgreSQL. On Render, DATABASE_URL is supplied by the
# database defined in render.yaml. Solid Cache, Queue, and Cable share this
# single database (see db/migrate/*_create_solid_tables.rb).
production:
  adapter: postgresql
  encoding: unicode
  # Puma threads and (when SOLID_QUEUE_MODE=async) Solid Queue's threads share this pool.
  max_connections: <%= ENV.fetch("DB_POOL") { 15 } %>
  url: <%= ENV["DATABASE_URL"] %>
